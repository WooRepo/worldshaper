WORLDSHAPER
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>WORLDSHAPER</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      .app-container {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      #openseadragon-viewer {
        flex: 1;
        height: 100%;
        background-color: #111;
      }

      .story-container {
        flex: 1;
        height: 100%;
        background-color: #1a1a1a;
        color: #fff;
        padding: 24px;
        box-sizing: border-box;
        overflow-y: auto; 
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div id="openseadragon-viewer"></div>
      <div class="story-container">
        <div id="story-text">Loading... /div>
      </div>
    </div>

    <script type="module">
      import { newStory } from "./history.js";
      const strNewStory = JSON.stringify(newStory, null, 4);
      const storyElement = document.getElementById("story-text");
      if (storyElement) {
        storyElement.textContent = strNewStory;
        storyElement.textContent = "Check the console for the History and information of planets.";
      }
    </script>
    <script type="module" src="./index.js"></script>
  >
